<header>Machine Learning on modern GPUs</header>
<h2 id="what-is-a-gpu">What is a GPU?</h2>
<p><img src="assets/nvidia_a100.jpg" alt="center" /></p>
<ul>
<li data-marpit-fragment="1">&quot;<em>Graphics Processing Unit</em>&quot;</li>
<li data-marpit-fragment="2">&quot;<em>PC extension cards to <strong>render pixels</strong> on your screen fast(er) — typically for video games</em>&quot;</li>
<li data-marpit-fragment="3">&quot;<em>A device that turns electricity into <strong>heat</strong>, cool <strong>explosions</strong> on your screen, and chatbot <strong>gibberish</strong> <img class="emoji" draggable="false" alt="🔥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f525.svg" data-marp-twemoji=""/></em>&quot;</li>
<li data-marpit-fragment="4">&quot;<em>Hardware with ~1000x more cores than CPUs, and very good at <em>matrix multiplications</em> <img class="emoji" draggable="false" alt="🧮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ee.svg" data-marp-twemoji=""/></em>&quot;</li>
<li data-marpit-fragment="5">All of the above? <img class="emoji" draggable="false" alt="☝️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/261d.svg" data-marp-twemoji=""/></li>
</ul>

<header>Machine Learning on modern GPUs</header>
<h2 id="cuda-programming-model-14">CUDA Programming Model (1/4)</h2>
<div class="columns">
<div class="fs18">
<p>A hierarchy of grids, blocks, threads:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Grid
├── Block (0,0)
│   ├── Thread (0,0)
│   ├── Thread (1,0)
│   ├── Thread (2,0)
│   └── ... (up to 1024 threads per block)
├── Block (1,0)
│   ├── Thread (0,0)
│   └── ...
└── ... (potentially millions of blocks)
</code></pre>
<ul>
<li>
<p><strong>Thread</strong>: The smallest unit of compute. Each thread has a unique ID (<code>threadIdx.x</code>) within its block.</p>
</li>
<li>
<p><strong>Block</strong>: A group of threads that can share memory and synchronise.</p>
</li>
<li>
<p><strong>Grid</strong>: All blocks launched by a single kernel (1D, 2D, 3D, etc.).</p>
</li>
<li>
<p>Each thread computes its global index: <code>int idx = blockIdx.x * blockDim.x + threadIdx.x;</code></p>
</div>
<div>
</li>
</ul>
<p><a href="https://www.digitalocean.com/community/tutorials/understanding-tensor-cores"><img src="assets/processing_flow.png" alt="" /></a></p>
  </div>
</div>

<h2 id="cuda-programming-model-34--matrix-multiplication-22">CUDA Programming Model (3/4) — Matrix multiplication (2/2)</h2>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">
<span class="hljs-comment">// <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Extremely naive, tiled matrix multiplication using shared memory:</span>
<span class="hljs-function">__global__ <span class="hljs-type">void</span> <span class="hljs-title">matmulTiled</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">float</span> *A, <span class="hljs-type">const</span> <span class="hljs-type">float</span> *B, <span class="hljs-type">float</span> *C,
                            <span class="hljs-type">int</span> M, <span class="hljs-type">int</span> N, <span class="hljs-type">int</span> K)</span> <span class="hljs-comment">// A is MxK, B is KxN, C is MxN.</span>
</span>{
    __shared__ <span class="hljs-type">float</span> As[TILE][TILE]; <span class="hljs-comment">// Block-level L1 shared memory.</span>
    __shared__ <span class="hljs-type">float</span> Bs[TILE][TILE]; <span class="hljs-comment">// Block-level L1 shared memory.</span>

    <span class="hljs-type">int</span> row = blockIdx.y * TILE + threadIdx.y;
    <span class="hljs-type">int</span> col = blockIdx.x * TILE + threadIdx.x;
    <span class="hljs-type">float</span> acc = <span class="hljs-number">0.0f</span>;

    <span class="hljs-comment">// Slide the tile across the K dimension:</span>
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> t = <span class="hljs-number">0</span>; t &lt; (K + TILE - <span class="hljs-number">1</span>) / TILE; ++t)
    {
        <span class="hljs-type">int</span> aCol = t * TILE + threadIdx.x;
        <span class="hljs-type">int</span> bRow = t * TILE + threadIdx.y;

        <span class="hljs-comment">// Load one tile of A and one tile of B into shared memory,</span>
        <span class="hljs-comment">// guarding against out-of-range indices for non-multiple sizes:</span>
        As[threadIdx.y][threadIdx.x] =
            (row &lt; M &amp;&amp; aCol &lt; K) ? A[row * K + aCol] : <span class="hljs-number">0.0f</span>;
        Bs[threadIdx.y][threadIdx.x] =
            (bRow &lt; K &amp;&amp; col &lt; N) ? B[bRow * N + col] : <span class="hljs-number">0.0f</span>;

        __syncthreads(); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Threads wait until the whole tile is loaded.</span>

        <span class="hljs-comment">// Multiply the two tiles together:</span>
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> k = <span class="hljs-number">0</span>; k &lt; TILE; ++k)
            acc += As[threadIdx.y][k] * Bs[k][threadIdx.x];

        __syncthreads(); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Threads wait before moving on to next tile.</span>
    }

    <span class="hljs-keyword">if</span> (row &lt; M &amp;&amp; col &lt; N)
        C[row * N + col] = acc;
}

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Extremely sub-optimal:</span>
<span class="hljs-comment">// - Maybe ~3-4 TFLOPS or 15~20% of peak GPU performance with FP32?</span>
<span class="hljs-comment">// - __syncthreads makes all threads in a block wait. Very inefficient!</span>
<span class="hljs-comment">// - 1 thread could compute a micro-tile, keeping the accumulators in registers.</span>
<span class="hljs-comment">// - The acc += As[..] * Bs[..] loop runs on CUDA cores, not Tensor cores.</span>
<span class="hljs-comment">// - Instead, use cuBLAS (cublasGemmEx / cublasLtMatmul), CUTLASS, or cuDNN.</span>
</code></pre>

<header>Machine Learning on modern GPUs</header>
<h2 id="cuda-programming-model-44-warps--simt">CUDA Programming Model (4/4) —Warps &amp; SIMT</h2>
<p>GPUs execute <strong>threads</strong> in groups of 32 called <strong>warps</strong>, running the <em>same instruction at the same time</em> (SIMT).<br />
&quot;Wrap divergence&quot;, i.e., branching (<code>if</code>) is <strong>evil</strong>:</p>
<ul>
<li>GPUs <em>cannot execute</em> two different instructions at the same time in one warp.</li>
<li>GPUs execute both branches <em>sequentially</em>, <em>hiding</em> the threads that do not participate.</li>
<li>This reduces performance by at least 50%, and... <em>despite showing <strong>100% GPU utilisation</strong></em>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">// BAD: warp divergence — i.e., the two below instructions are run sequentially:</span>
<span class="hljs-keyword">if</span> (threadIdx.x % <span class="hljs-number">2</span> == <span class="hljs-number">0</span>) {
    c[idx] = a[idx] + b[idx];    <span class="hljs-comment">// even threads do this</span>
} <span class="hljs-keyword">else</span> {
    c[idx] = a[idx] - b[idx];    <span class="hljs-comment">// odd threads do that</span>
}

<span class="hljs-comment">// GOOD: branchless — i.e., no divergence:</span>
<span class="hljs-type">float</span> sign = (threadIdx.x % <span class="hljs-number">2</span> == <span class="hljs-number">0</span>) ? <span class="hljs-number">1.0f</span> : <span class="hljs-number">-1.0f</span>;
c[idx] = a[idx] + sign * b[idx];  <span class="hljs-comment">// all threads execute the same instruction</span>
</code></pre>
</section>

<header>Machine Learning on modern GPUs</header>
<h2 id="what-is-gpu-utilisation-anyway">What is GPU utilisation anyway?</h2>
<p>Tools like <a href="https://docs.nvidia.com/deploy/nvidia-smi/index.html"><code>nvidia-smi</code></a> or <a href="https://developer.nvidia.com/dcgm">DCGM</a> (Nvidia Data Center GPU Manager)<br />
report GPU utilisation as an indication of whether <em>a Streaming Multiprocessor (SM)</em><br />
<em>is actively running</em> or holding a warp.</p>
<ul>
<li>If threads run branches...</li>
<li>If threads wait on memory...</li>
<li>If threads are stalling for any other reason...</li>
</ul>
<p>the GPU is still &quot;occupied&quot; and reports <strong>100% GPU utilisation</strong>.</p>
<p><strong>Solution</strong>:</p>
<ul>
<li><img class="emoji" draggable="false" alt="👉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f449.svg" data-marp-twemoji=""/> Have finer-grained metrics.</li>
<li><img class="emoji" draggable="false" alt="👉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f449.svg" data-marp-twemoji=""/> Measure <em>everything</em>.</li>
<li><img class="emoji" draggable="false" alt="👉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f449.svg" data-marp-twemoji=""/> Detect. Localise. Diagnose.</li>
</ul>
<p>(More details about <em>how</em> to achieve this later in this deck.)</p>

<header>Machine Learning on modern GPUs</header>
<h2 id="gpu-hardware-architecture-15">GPU hardware architecture (1/5)</h2>
<div class="columns">
  <div>
<ul>
<li>1 GPU = n Texture Processing Clusters
<ul>
<li>1 TPC = n Graphics Processing Clusters
<ul>
<li>1 GPC = n Stream Multiprocessors
<ul>
<li>1 SM =
<ul>
<li>CUDA Cores</li>
<li>Tensor Cores</li>
</ul>
</li>
</ul>
</li>
</ul>
</li>
</ul>
</li>
<li><a href="https://en.wikipedia.org/wiki/High_Bandwidth_Memory">HBM</a> = High Bandwidth Memory</li>
<li>NVLink = GPU-to-GPU interconnect<br />
<small>(Covered in a future knowledge sharing session.)</small></li>
</ul>
<div class="fs18">
Also:
<ul>
<li>Ray Tracing (RT) Cores, for path of light.</li>
<li>Possibly more, depending on the architecture generation.</li>
<li>etc.</li>
</ul>
<p>Sources: <a href="https://developer.nvidia.com/blog/nvidia-ampere-architecture-in-depth">Ampere architecture in depth</a>; <a href="https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/a100/pdf/nvidia-a100-datasheet-us-nvidia-1758950-r4-web.pdf">A100 datasheet</a>.</p>
</div>
  </div>
  <div class="fs18">
<p>E.g., <a href="https://www.nvidia.com/en-us/data-center/a100/">A100</a> GPUs:</p>
<ul>

<li>64x FP32 CUDA Cores / SM ; <strong>6912 FP32 CUDA Cores</strong></li>

<li>5 HBM2 stacks ; <strong>40 GB</strong> HBM2 @ <strong>1,555 GB/s</strong></li>

<p>E.g., GA100 (A100 family):<br />
<img src="assets/nvidia_a100_full.png" alt="" style="height:200px;" /></p>

<header>Machine Learning on modern GPUs</header>
<h2 id="gpu-hardware-architecture-35--floating-point-numbers">GPU hardware architecture (3/5) — Floating point numbers</h2>
<div class="columns">
  <div class="fs18">
<p><strong>Exponent = &quot;Range&quot; = the <u>window</u></strong>:<br />
Picks which two consecutive powers of 2 the number lands between, e.g., <code>[2, 4)</code>, <code>[4, 8)</code>, <code>[8, 16)</code>, <code>[16, 32)</code>, etc.<br />
Sets the <em>scale</em>.</p>
<p><strong>Mantissa = &quot;Precision&quot; = the <u>offset</u></strong>:<br />
Splits that window into 2<sup>Precision</sup> (e.g., 2<sup>23</sup> for FP32) buckets, pinpointing <em>where</em> the number is inside the window.</p>
<p><strong>Metaphor</strong>:<br />
Choose a city block (window), and then the address on it (offset).</p>
<p><strong>Example</strong>: 6.1</p>
<ul>
<li>Window = <code>[4, 8) = [2², 2³)</code> → Exponent = 2 + 127 (bias)</li>
</ul>
<center>
<p><a href="https://fabiensanglard.net/floating_point_visually_explained/"><img src="assets/floating_point_window.svg" alt="" style="height:90px;" /></a></p>
</center>
<ul>
<li>Offset = (6.1 − 4) / 4 = 0.525 → Repeatedly take <code>int(X * 2)</code></li>
</ul>
<center>
<p><code>0</code> <code>10000001</code> <code>10000110011001100110011</code> ≈ 6.0999999</p>
</center>
  </div>
  <div class="v-line">
  <center>
<p><img src="assets/floating_points.png" alt="" style="height:180px;" /></p>
  </center>
  <div class="fs14 h-line">
<ul>
<li>
<p><strong>FP32</strong>: Too slow on Tensor Cores <img class="emoji" draggable="false" alt="🐌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f40c.svg" data-marp-twemoji=""/></p>
</li>
<li>
<p><strong>FP16</strong>:</p>
<ul>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2795.svg" data-marp-twemoji=""/>  50% mem. v.s. FP32 ; 4x on CUDA Cores</li>
<li><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2796.svg" data-marp-twemoji=""/> Unstable (over/underflow) <img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a5.svg" data-marp-twemoji=""/> → <code>torch.amp.GradScaler</code> <a href="https://pytorch.org/blog/what-every-user-should-know-about-mixed-precision-training-in-pytorch/">[1]</a></li>
</ul>
</li>
<li>
<p><strong>TF32</strong>: FP32 range. FP16 precision.</p>
<ul>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2795.svg" data-marp-twemoji=""/> 41% mem. v.s. FP32.</li>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2795.svg" data-marp-twemoji=""/> <strong>8-16x</strong> faster matmul v.s. FP32. <img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a1.svg" data-marp-twemoji=""/></li>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2795.svg" data-marp-twemoji=""/> Zero code change (<strong>Tensor Core</strong> hardware optimisation).</li>
</ul>
</li>
<li>
<p><strong>BF16</strong>: FP32 range. Less precision.</p>
<ul>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2795.svg" data-marp-twemoji=""/> 50% mem. v.s. FP32.</li>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2795.svg" data-marp-twemoji=""/> <strong>16-32x</strong> faster matmul v.s. FP32. <img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a1.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a1.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a1.svg" data-marp-twemoji=""/> (2x on CUDA Cores.)</li>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2795.svg" data-marp-twemoji=""/> No loss-scaling needed (unlike FP16).</li>
<li><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2795.svg" data-marp-twemoji=""/> Stable (full FP32 range) ; Same accuracy as FP32 in training.</li>
<li><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2796.svg" data-marp-twemoji=""/> Coarser precision than FP16. Not for HPC → Use FP64.</li>
<li><img class="emoji" draggable="false" alt="➖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2796.svg" data-marp-twemoji=""/> Requires <code>with torch.autocast(dtype=torch.bfloat16)</code></li>
</ul>
</div>
</div>
</li>
</ul>
</div>
</section>

<h2 id="gpu-hardware-architecture-45--a100-gpu-performance-specs">GPU hardware architecture (4/5) — A100 GPU performance specs</h2>
<div class="columns">
  <div>
<table>
<thead>
<tr>
<th>Metric</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td>Peak FP64 <sup>1</sup></td>
<td>9.7 TFLOPS</td>
</tr>
<tr>
<td>Peak FP64 Tensor Core <sup>1</sup></td>
<td>19.5 TFLOPS</td>
</tr>
<tr>
<td>Peak FP32 <sup>1</sup></td>
<td><strong>19.5 TFLOPS</strong></td>
</tr>
<tr>
<td>Peak FP16 <sup>1</sup></td>
<td>78 TFLOPS</td>
</tr>
<tr>
<td>Peak BF16 <sup>1</sup></td>

<td><strong>156 TFLOPS</strong> | 312 TFLOPS <sup>2</sup></td>
</tr>
<tr>
<td>Peak FP16 Tensor Core <sup>1</sup></td>
<td>312 TFLOPS | 624 TFLOPS <sup>2</sup></td>
</tr>
<tr>
<td>Peak BF16 Tensor Core <sup>1</sup></td>
<td><strong>312 TFLOPS</strong> | 624 TFLOPS <sup>2</sup></td>

<div class="fs18">

</div>
  </div>
  <div class="fs18">
<p><img class="emoji" draggable="false" alt="👉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f449.svg" data-marp-twemoji=""/> Tensor Cores are drastically faster:</p>
<ul>
<li>TF32 on Tensor Cores = <strong>8-16x</strong> FP32 on CUDA Cores.</li>

<p><img class="emoji" draggable="false" alt="👉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f449.svg" data-marp-twemoji=""/> Little-to-no precision loss with TF32 / BF16, e.g.:</p>

<a href="https://arxiv.org/abs/2203.03341">arxiv:2203.03341</a> (Nvidia + Tokyo Institute of Tech., 2022)</li>

<em>2: Effective TFLOPS / TOPS using the (new) Sparsity feature.</em></p>

<h2 id="back-to-cuda--a-more-efficient-matrix-multiplication-12">Back to CUDA — A more efficient matrix multiplication (1/2)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// Acronyms:</span>
<span class="hljs-comment">// - MMA = Matrix Multiply-Accumulate.</span>
<span class="hljs-comment">// - WMMA = Warp Matrix Multiply-Accumulate (i.e., uses Tensor cores).</span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;mma.h&gt;</span></span>
<span class="hljs-keyword">using</span> <span class="hljs-keyword">namespace</span> nvcuda::wmma;

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Better (but still not optimal): maybe ~30-80 TFLOPS and ~10–20x v.s. naive?</span>
<span class="hljs-comment">//</span>
<span class="hljs-comment">// C = A * B. A: MxK (row-major, half), B: KxN (row-major, half),</span>
<span class="hljs-comment">// C: MxN (float). M, N, K multiples of 16 for this minimal version.</span>
<span class="hljs-comment">//</span>
<span class="hljs-function">__global__ <span class="hljs-type">void</span> <span class="hljs-title">matmulWMMA</span><span class="hljs-params">(<span class="hljs-type">const</span> half *A, <span class="hljs-type">const</span> half *B, <span class="hljs-type">float</span> *C,
                           <span class="hljs-type">int</span> M, <span class="hljs-type">int</span> N, <span class="hljs-type">int</span> K)</span>
</span>{
    <span class="hljs-comment">// Each warp computes one 16x16 output tile:</span>
    <span class="hljs-type">int</span> warpM = (blockIdx.y * blockDim.y + threadIdx.y);
    <span class="hljs-type">int</span> warpN = (blockIdx.x * blockDim.x + threadIdx.x) / warpSize;
    <span class="hljs-comment">// Store tiles and accumulator in fast(er) Tensor Core registers:</span>
    fragment&lt;matrix_a, <span class="hljs-number">16</span>, <span class="hljs-number">16</span>, <span class="hljs-number">16</span>, half, row_major&gt; aFrag;
    fragment&lt;matrix_b, <span class="hljs-number">16</span>, <span class="hljs-number">16</span>, <span class="hljs-number">16</span>, half, row_major&gt; bFrag;
    fragment&lt;accumulator, <span class="hljs-number">16</span>, <span class="hljs-number">16</span>, <span class="hljs-number">16</span>, <span class="hljs-type">float</span>&gt;        acc;
    <span class="hljs-built_in">fill_fragment</span>(acc, <span class="hljs-number">0.0f</span>);
    <span class="hljs-comment">// Slide 16-wide tiles across K, accumulating in the Tensor Cores&#x27; registers:</span>
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> k = <span class="hljs-number">0</span>; k &lt; K; k += <span class="hljs-number">16</span>) {
        <span class="hljs-built_in">load_matrix_sync</span>(aFrag, A + warpM * <span class="hljs-number">16</span> * K + k, K);
        <span class="hljs-built_in">load_matrix_sync</span>(bFrag, B + k * N + warpN * <span class="hljs-number">16</span>, N);
        <span class="hljs-built_in">mma_sync</span>(acc, aFrag, bFrag, acc); <span class="hljs-comment">// Calls Tensor Core MMA.</span>
    }
    <span class="hljs-comment">// Waits until all warps have completed and stores matrix fragment back to DRAM:</span>
    <span class="hljs-built_in">store_matrix_sync</span>(C + warpM * <span class="hljs-number">16</span> * N + warpN * <span class="hljs-number">16</span>, acc, N, mem_row_major);
}
</code></pre>
</section>

<h2 id="back-to-cuda--a-more-efficient-matrix-multiplication-22">Back to CUDA — A more efficient matrix multiplication (2/2)</h2>
<div class="fs16">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="⚠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Even better (but still not optimal): maybe ~250-300 TFLOPS and ~70–90x v.s. naive?</span>
<span class="hljs-comment">//</span>
<span class="hljs-comment">// C = A * B, all row-major.  A: MxK, B: KxN, C: MxN.</span>
<span class="hljs-comment">// cuBLAS is column-major, so we compute C^T = B^T * A^T by swapping A and B.</span>
<span class="hljs-comment">//</span>
cublasLtHandle_t lt;  <span class="hljs-built_in">cublasLtCreate</span>(&amp;lt);

<span class="hljs-type">float</span> alpha = <span class="hljs-number">1.0f</span>, beta = <span class="hljs-number">0.0f</span>;
<span class="hljs-built_in">cublasGemmEx</span>( <span class="hljs-comment">// GEMM = GEneral Matrix Multiplication.</span>
    handle,
    CUBLAS_OP_N, CUBLAS_OP_N,
    N, M, K,                       <span class="hljs-comment">// swapped: leading dim is N now.</span>
    &amp;alpha,
    B, CUDA_R_16F, N,              <span class="hljs-comment">// B first. FP32 -&gt; FP16.</span>
    A, CUDA_R_16F, K,              <span class="hljs-comment">// A second. FP32 -&gt; FP16.</span>
    &amp;beta,
    C, CUDA_R_16F, N,
    CUBLAS_COMPUTE_32F,            <span class="hljs-comment">// Accumuulate using FP32.</span>
    CUBLAS_GEMM_DEFAULT_TENSOR_OP  <span class="hljs-comment">// Use Tensor Cores.</span>
);
</code></pre>
<p>Or use WGMMA (WarpGroup Matrix Multiply-Accumulate):</p>
<ul>
<li>Leverages Tensor Cores.</li>
<li>Warpgroup-level instructions for Hopper (or later) architectures.</li>
<li>Asynchronous ; Bypass shared memory synchronization.</li>
<li>128 threads.</li>
<li>(Possibly makes coffee for you too! <img class="emoji" draggable="false" alt="☕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2615.svg" data-marp-twemoji=""/>)</li>
</ul>
</div>

<header>Machine Learning on modern GPUs</header>
<h2 id="which-metrics-to-track-13">Which metrics to track? (1/3)</h2>
<div class="columns">
<div class="fs18">
<h3 id="white-box-vs-black-box-google-sre-book">White-box v.s. black-box (<a href="https://sre.google/sre-book/monitoring-distributed-systems/">Google SRE book</a>)</h3>
<ul>
<li>
<p><strong>Black-box</strong>: symptom-oriented, from the <em>outside</em>, what the ML researcher feels: &quot;<em>Is my model training code progressing fast/well enough? Is it using resources well?</em>&quot;<br />
E.g., throughput (tokens/s), step time, MFU, Goodput, etc.</p>
</li>
<li>
<p><strong>White-box</strong>: based on <em>internals</em> — logs, counters, metrics exposed by the system. Tells you <em>why</em> training code may not be progressing fast/well enough.<br />
E.g., GPU/SM utilisation, Tensor Core utilisation, SM efficiency, HBM utilisation, HBM bandwidth, etc.</p>
</li>
<li>
<p>Black-box = <strong>symptoms</strong> (<em>must</em>: track, <em>should</em>: alert/notify)<br />
White-box = <strong>causes</strong> (debug with these).</p>
</li>
</ul>
</div>
<div class="fs18">
<h3 id="tiered-metrics-cost-vs-detail">Tiered metrics (cost v.s. detail)</h3>
<ul>
<li>
<p><strong>Tier 1 — high-level, always-on</strong> time series:<br />
Throughput, GPU/SM utilisation, HBM utilisation.<br />
Cheap, cluster-wide dashboards.<br />
<strong>Goal</strong>: <em>Detect.</em></p>
</li>
<li>
<p><strong>Tier 2 — low-level, always-on</strong> time series:<br />
SM occupancy/efficiency, Tensor Cores utilisation, DRAM/PCIe/NVLink bandwidth, data loading throughput, time-to-first-byte, etc.<br />
<strong>Goal</strong>: <em>Localise</em> — e.g., determine whether compute-bound or memory-bound or I/O-bound.</p>
</li>
<li>
<p><strong>Tier 3 — on-demand profiling</strong>:<br />
Roofline, warp stalls, per-kernel breakdown (Nvidia Nsight <a href="https://developer.nvidia.com/nsight-systems"><code>nsys</code></a>/<a href="https://docs.nvidia.com/nsight-compute/NsightComputeCli/index.html"><code>ncu</code></a>, <a href="https://docs.pytorch.org/tutorials/beginner/hta_intro_tutorial.html">HTA</a>, etc.). Expensive, per-job.<br />
<strong>Goal</strong>: <em>Diagnose</em> — e.g., find which ML code is sub-optimal.</p>
</li>
</ul>
</div>
</div>
</section>

<header>Machine Learning on modern GPUs</header>
<h2 id="which-metrics-to-track-23--white-box-metrics">Which metrics to track? (2/3) — White-box metrics</h2>
<div class="columns">
<div class="fs18">
<p><strong>Compute</strong>:</p>
<ul>
<li><strong>GPU utilisation (%)</strong>
<ul>
<li>Necessary but <em>not</em> sufficient.</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Only tells you that <em>at least</em> 1 SM is busy.</li>
</ul>
</li>
<li><strong>SM occupancy</strong> — active warps / max warps.
<ul>
<li>Tells you whether enough warps to hide memory latency.</li>
</ul>
</li>
<li><strong>SM efficiency</strong> — achieved FLOPs v.s. peak.</li>
<li><strong>Tensor Core util. (%)</strong> — using fast or slow (CUDA) cores?</li>
</ul>
</div>
<div class="fs18">
<p><strong>Data movement &amp; scaling:</strong></p>
<ul>
<li><strong>HBM memory footprint</strong> — How much of the 40 GB used? Caps batch size &amp; model size.</li>
<li><strong>DRAM (HBM) bandwidth utililisation (%)</strong> — close to the ~1.5 TB/s ceiling? High → memory-bound.</li>
<li><strong>PCIe host from/to device transfer</strong> — Are H2D/D2H copies (<code>cudaMemcpy</code>) stalling the GPU?</li>
<li><strong>NVLink / NVSwitch bandwidth</strong> — Multi-GPU: is &quot;all-reduce&quot; / communication the bottleneck? (More in a future session.)</li>
</ul>
</div>
</div>
</section>

<header>Machine Learning on modern GPUs</header>
<h2 id="which-metrics-to-track-33--black-box-metrics">Which metrics to track? (3/3) — Black-box metrics</h2>
<div class="columns">
<div class="fs18">
<p><strong>Is the job progressing? Is it using hardware well?</strong></p>
<ul>
<li>
<p><strong>Throughput</strong>: tokens/s, samples/s, steps/s.</p>
</li>
<li>
<p><strong>Goodput</strong> [<a href="https://arxiv.org/abs/2410.21680">RSC</a>]: <code>productive_work / unit_time</code></p>
</li>
<li>
<p><strong>MFU</strong> (Model FLOPs Utilisation) [<a href="https://arxiv.org/abs/2204.02311">PaLM</a>]:<br />
<code>useful_model_flops / peak_flops</code>.</p>
<ul>
<li>Only <em>necessary</em> math counts → excludes waste (recompute, stalls, communication).</li>
<li>&quot;Good&quot; for a large-scale training ≈ <strong>35–55%</strong>.</li>
</ul>
</li>
<li>
<p><strong>HFU</strong> (Hardware FLOPs Utilisation): like MFU but takes recompute into account, so HFU ≥ MFU.<br />
(<code>HFU/MFU − 1</code> ≈ fraction of FLOPs spent on recompute.)</p>
</li>
</ul>
</div>
<div class="fs18">
<p><strong>Reliability &amp; Overhead at scale</strong> [<a href="https://arxiv.org/abs/2410.21680">RSC</a>] (Meta, 2024):</p>
<ul>
<li>
<p><strong>ETTR</strong> (Effective Training Time Ratio):<br />
<code>productive_runtime / available_wallclock</code><br />
<code>1.0</code> = zero time wasted.</p>
</li>
<li>
<p><strong>MTTF</strong> (Mean Time To Failure) =<br />
<code>1 / (nodes_count * failure_rate)</code></p>
</li>
<li>
<p><strong>Wasted time</strong> (decreases Goodput):</p>
<ul>
<li><em>Restart</em> overhead.</li>
<li><em>Checkpoint</em> writes/reads.</li>
<li><em>Catch-up</em> since last checkpoint.</li>
</ul>
</li>
</ul>
</div>
</div>
</section>

<header>Machine Learning on modern GPUs</header>
<h2 id="how-to-measure-these-metrics-12">How to measure these metrics? (1/2)</h2>
<p>No single tool — depending on the metrics and the tier:</p>
<ul>
<li>
<p><strong>Black-box</strong> — computed in the training loop.<br />
E.g., calculate samples/s, MFU, etc. → log to W&amp;B.<br />
(<em>Optionally</em> expose via <a href="https://opentelemetry.io/">OpenTelemetry</a>, to then alert on specific levels.)</p>
</li>
<li>
<p><strong>Tier 1/2</strong>: <a href="https://developer.nvidia.com/dcgm">DCGM</a> → <a href="https://opentelemetry.io/">OpenTelemetry</a> / Prometheus → Grafana.</p>
<ul>
<li>On SageMaker: very limited — GPU utilisation, HBM utilisation.</li>
<li>On Kubernetes: NVIDIA GPU Operator ships <code>dcgm-exporter</code> (DaemonSet).</li>
<li>On Ray: <code>ray_node_gpus_utilization</code> for per-actor attribution.</li>
</ul>
</li>
<li>
<p><strong>Tier 3</strong> — on-demand profiling.<br />
<a href="https://developer.nvidia.com/nsight-systems">Nsight</a>, <a href="https://docs.pytorch.org/tutorials/beginner/hta_intro_tutorial.html">HTA</a>, <code>nsys</code> (timeline), <code>ncu</code> (per-kernel counters).</p>
</li>
</ul>
</section>

<header>Machine Learning on modern GPUs</header>
<h2 id="how-to-measure-these-metrics-22">How to measure these metrics? (2/2)</h2>
<div class="fs16">
<center>
<table>
<thead>
<tr>
<th>Metric</th>
<th>Tier</th>
<th>How</th>
</tr>
</thead>
<tbody>
<tr>
<td>GPU utilisation</td>
<td>1</td>
<td><code>DCGM_FI_DEV_GPU_UTIL</code> (<img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> coarse ; 100% can be a lie!)</td>
</tr>
<tr>
<td>HBM footprint</td>
<td>1</td>
<td><code>DCGM_FI_DEV_FB_{USED,FREE}</code></td>
</tr>
<tr>
<td>MFU</td>
<td>1</td>
<td>Depends on model. See <a href="https://arxiv.org/abs/2204.02311">PaLM</a> and litterature.</td>
</tr>
<tr>
<td>SM efficiency</td>
<td>2</td>
<td><code>DCGM_FI_PROF_SM_ACTIVE</code></td>
</tr>
<tr>
<td>SM occupancy</td>
<td>2</td>
<td><code>DCGM_FI_PROF_SM_OCCUPANCY</code></td>
</tr>
<tr>
<td>Tensor Core %</td>
<td>2</td>
<td><code>DCGM_FI_PROF_PIPE_TENSOR_ACTIVE</code></td>
</tr>
<tr>
<td>HBM bandwidth</td>
<td>2</td>
<td><code>DCGM_FI_PROF_DRAM_ACTIVE</code> × ~1.5 TB/s for A100</td>
</tr>
<tr>
<td>PCIe H2D/D2H</td>
<td>2</td>
<td><code>DCGM_FI_PROF_PCIE_{RX,TX}_BYTES</code></td>
</tr>
<tr>
<td>NVLink</td>
<td>2</td>
<td><code>DCGM_FI_PROF_NVLINK_{RX,TX}_BYTES</code></td>
</tr>
<tr>
<td>Achieved FLOPs</td>
<td>3</td>
<td><code>ncu</code> FLOP counters</td>
</tr>
<tr>
<td>Roofline</td>
<td>3</td>
<td><code>ncu --set roofline</code></td>
</tr>
<tr>
<td>Warp stalls</td>
<td>3</td>
<td><code>ncu</code> (sampled)</td>
</tr>
<tr>
<td>Kernel breakdown</td>
<td>3</td>
<td><code>nsys</code> / PyTorch profiler</td>
</tr>
</tbody>
</table>
</center>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Warning:</p>
<ul>
<li><code>_PROF_</code> can conflict with Nsight — <code>dcgmi profile --pause</code> while profiling.</li>
<li><code>SM_ACTIVE</code> / <code>TENSOR_ACTIVE</code> = <em>activity</em> ratios, <strong>not</strong> achieved FLOPs v.s. peak (→ use MFU / <code>ncu</code>).</li>
</ul>
</div>
</section>
